apiVersion: inference.coreweave.m.upbound.io/v1beta1
kind: CapacityClaim
metadata:
  annotations:
    meta.upbound.io/example-id: inference/v1beta1/capacityclaim
    uptest.upbound.io/timeout: "7200"
  labels:
    testing.upbound.io/example-name: inference-v1beta1-capacityclaim
  name: example-capacityclaim
  namespace: upbound-system
spec:
  forProvider:
    name: example-capacityclaim
    resources:
      capacityType: CAPACITY_TYPE_MANAGED
      instanceType: rtxp6000-8x
      instanceCount: 1
      zones:
      - US-EAST-04A
