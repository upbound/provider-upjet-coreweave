apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: BucketLifecycleConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketlifecycleconfiguration
  labels:
    testing.upbound.io/example-name: objectstorage-v1beta1-bucketlifecycleconfiguration
  name: example-bucketlifecycleconfiguration
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: objectstorage-v1beta1-bucketlifecycleconfiguration
    rule:
    - id: cleanup-logs
      status: Enabled
      filter:
        and:
          prefix: logs/
          objectSizeGreaterThan: 1000000
          tags:
            env: prod
      expiration:
        days: 30
      noncurrentVersionExpiration:
        noncurrentDays: 7
        newerNoncurrentVersions: 2
    - id: expire-traces
      status: Enabled
      filter:
        prefix: traces/
      expiration:
        date: "2027-01-01T00:00:00Z"
      abortIncompleteMultipartUpload:
        daysAfterInitiation: 5

---

apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: BucketVersioning
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketlifecycleconfiguration
  labels:
    testing.upbound.io/example-name: objectstorage-v1beta1-bucketlifecycleconfiguration
  name: example-bucketlifecycleconfiguration
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: objectstorage-v1beta1-bucketlifecycleconfiguration
    versioningConfiguration:
      status: Enabled

---

apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketlifecycleconfiguration
  labels:
    testing.upbound.io/example-name: objectstorage-v1beta1-bucketlifecycleconfiguration
  name: example-bucketlifecycleconfiguration
  namespace: upbound-system
spec:
  forProvider:
    zone: US-EAST-04A
