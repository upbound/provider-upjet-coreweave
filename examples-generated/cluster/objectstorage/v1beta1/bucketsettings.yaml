apiVersion: objectstorage.coreweave.upbound.io/v1beta1
kind: BucketSettings
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketsettings
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    archiveAfterLastAccessDays: 60
    archiveEnabled: true
    auditLoggingEnabled: true
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    capacityCapBytes: 1099511627776

---

apiVersion: objectstorage.coreweave.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketsettings
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    zone: US-EAST-04A
