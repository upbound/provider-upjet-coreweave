apiVersion: containerregistry.coreweave.upbound.io/v1beta1
kind: AccessConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: containerregistry/v1beta1/accessconfiguration
  labels:
    testing.upbound.io/example-name: images
  name: images
spec:
  forProvider:
    namespaceSelector:
      matchLabels:
        testing.upbound.io/example-name: images
    policySets:
      readers:
        identity_selector: COREWEAVE
        rules:
          pull:
            expression: identity["org_id"] == ${jsonencode(var.org_id)} && "read_registry_content"
              in identity["roles"] && request["type"] == "repository" && request["action"]
              == "pull"
    requestIpAcl:
      allowCidrs:
      - 192.0.2.0/24
      - 2001:db8::/32
      denyCidrs:
      - 192.0.2.128/25

---

apiVersion: containerregistry.coreweave.upbound.io/v1beta1
kind: Namespace
metadata:
  annotations:
    meta.upbound.io/example-id: containerregistry/v1beta1/accessconfiguration
  labels:
    testing.upbound.io/example-name: images
  name: images
spec:
  forProvider:
    initialAccessConfiguration: {}
    zone: US-LAB-01A
