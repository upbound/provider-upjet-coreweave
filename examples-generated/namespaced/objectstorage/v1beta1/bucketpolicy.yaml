apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: BucketPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketpolicy
  labels:
    testing.upbound.io/example-name: raw
  name: raw
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: raw
    policy: ${jsonencode(local.bucket_policy)}

---

apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketpolicy
  labels:
    testing.upbound.io/example-name: doc
  name: doc
  namespace: upbound-system
spec:
  forProvider:
    zone: US-EAST-04A

---

apiVersion: objectstorage.coreweave.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1beta1/bucketpolicy
  labels:
    testing.upbound.io/example-name: raw
  name: raw
  namespace: upbound-system
spec:
  forProvider:
    zone: US-EAST-04A
