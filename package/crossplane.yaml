apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-coreweave
  annotations:
    meta.crossplane.io/maintainer: Upbound <support@upbound.io>
    meta.crossplane.io/source: github.com/upbound/provider-upjet-coreweave
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Upbound's Crossplane provider to manage CoreWeave services in Kubernetes.
    meta.crossplane.io/readme: |
      Provider CoreWeave is a Crossplane provider for CoreWeave developed and
      supported by Upbound.
      Available resources and their fields can be found in the [Upbound
      Marketplace](https://marketplace.upbound.io/providers/upbound/provider-coreweave).
      If you encounter an issue please reach out on support@upbound.io email
      address.
spec:
  capabilities:
  - SafeStart
  # The image serves upjet's diff gRPC service from `provider internal
  # diff-server`, which the Crossplane CLI's resource simulate runs locally.
  - DiffServer
